<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Clothing Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>My Clothing Store</h1>
  <nav>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
    <a href="#men">Men</a>
    <a href="#women">Women</a>
    
  </nav>
</header>

<button class="cart">Cart (<span id="cart-count">0</span>)</button>

<main id="shop" class="products">
  <div class="card" data-product-id="1">
    <img src="111371-_0004_DSC02384.jpg" alt="T-Shirt">
    <h3>T-Shirt</h3>
    <p>Rs 1900.99</p>
    <button>Add to Cart</button>
  </div>
  <div class="card" data-product-id="2">
    <img src="./s-l1200.jpg" alt="Jeans">
    <h3>Blue Jeans</h3>
    <p>Rs 4900.99</p>
    <button>Add to Cart</button>
  </div>
  <div class="card" data-product-id="3">
    <img src="./download.jpg" alt="Jeans">
    <h3>Jacker</h3>
    <p>Rs 3900.99</p>
    <button>Add to Cart</button>
  </div>

  
  <!-- Add more product cards here -->
</main>

<footer id="about" style="text-align:center; padding:1rem; background:#f9f9f9;">
  <p>&copy; 2025 My Clothing Store. A modern, responsive site built with HTML, CSS & JS.</p>
</footer>

</body>
</html>
